<!-- XEM THỬ ADMIN VỚI DỮ LIỆU GIẢ — để xem / chụp màn hình giao diện mà không đụng dữ liệu thật.

     Chọn màn bằng ?v=…  (mở bằng python serve.py → http://localhost:8765/test/xem-admin.html?v=ds)
       tq Tổng quan · ds Đơn hàng · don form Thêm đơn · sua form Sửa đơn · ct chi tiết đơn · qr bảng mã QR

       sp / spm / spx Sản phẩm · ttc Thông tin chung · bst / bstm Bộ sưu tập · kk / kka / kkm Khoảnh khắc

     ?dx=… chỉ dùng trên máy làm việc (nạp bản nháp đề xuất ở thư mục demo/, không có trong git). -->

    { id: 2, expense_date: ngay(-2), category: 'Phụ kiện', item: 'Giấy gói', quantity: 20, unit_price: 3000, amount: 60000, note: '', image: '' },

  ]

  const sp = [[1, 'Tulip x cỏ suối', 'Từ 6xx', '1784038764629_optw_p1_1.webp'], [4, 'Hồng Ecuador rực rỡ', 'Từ 3xx', '1784038741137_optw_p4_1.jpg'],

    .map(([id, name, price, img], i) => ({ id, name, price, image: IMG + img, order_index: i, featured: i < 3, category: '',

  const bst = [

    { id: 7, name: 'BST 20/10', slug: 'bst-20-10', emoji: '💝', tagline: 'Gửi người phụ nữ của bạn một lời cảm ơn', cover_url: IMG + '1784038738364_optw_p9_1.webp', order_index: -3, active: true, start_date: ngay(7), end_date: ngay(27) },

  ]
  const gan = [[6, 1], [6, 10], [6, 2], [7, 9], [7, 12], [7, 4], [8, 25], [8, 2], [1, 4], [1, 17]].map(([c, p]) => ({ collection_id: c, product_id: p }))
  const gal = sp.concat(sp).map((p, i) => ({ id: 100 + i, url: p.image, caption: i % 3 ? '' : 'Bó giao chị Lan', category: ['Hoa bó', 'Sự kiện', 'Hoa tốt nghiệp'][i % 3], order_index: i, created_at: new Date().toISOString() }))
  const kh = []
  don.forEach(o => { if (!o.customer_phone) return; let c = kh.find(x => x.phone === o.customer_phone)
    if (!c) kh.push(c = { id: o.id, name: o.customer_name, phone: o.customer_phone, address: o.delivery_address, created_at: new Date(Date.now() - 30 * 864e5).toISOString() })

  const bang = { contact, nhat_ky_tai_khoan, orders: don, expenses: exp, customers: kh, products: sp, collections: bst, collection_products: gan, gallery: gal,
    gallery_categories: [{ id: 1, name: 'Hoa bó', emoji: '🌹', order_index: 1 }, { id: 5, name: 'Sự kiện', emoji: '🎉', order_index: 2 }, { id: 3, name: 'Hoa tốt nghiệp', emoji: '💐', order_index: 3 }],

                { id: 3, name: 'Ruy băng', category: 'Phụ kiện', last_price: 8000 }, { id: 4, name: 'Tulip', category: 'Hoa', last_price: 25000 }] }
  // Bản giả của sb.from(): chuỗi .select().eq()… trả dữ liệu giả; đếm (head) trả count
  w.eval('sb').from = ten => {
    let dl = (bang[ten] || []).slice(), dem = false, vaGhi = null, khuc = null
    const q = {
      select(_, o) { if (o && o.head) dem = true; return q },
      eq(c, v) { dl = dl.filter(r => r[c] === v); return q },
      in(c, v) { dl = dl.filter(r => v.includes(r[c])); return q },
      gte(c, v) { dl = dl.filter(r => (r[c] || '') >= v); return q },
      lt(c, v) { dl = dl.filter(r => (r[c] || '') < v); return q },
      lte(c, v) { dl = dl.filter(r => (r[c] || '') <= v); return q },
      ilike() { return q },
      order(c, o) { const len = !o || o.ascending !== false ? 1 : -1; dl = dl.slice().sort((a, b) => ((a[c] ?? '') < (b[c] ?? '') ? -1 : (a[c] ?? '') > (b[c] ?? '') ? 1 : 0) * len); return q },
      limit() { return q }, range(a, b) { khuc = [a, b + 1]; return q }, not() { return q }, or() { return q },
      maybeSingle() { return Promise.resolve({ data: dl[0] || null, error: null }) },
      single() { return Promise.resolve({ data: dl[0] || null, error: null }) },
      update(v) { vaGhi = v; return q }, insert() { return q }, delete() { return q },
      then(res, rej) { if (vaGhi) { dl.forEach(r => Object.assign(r, vaGhi)); vaGhi = null }
        return Promise.resolve(dem ? { count: dl.length, data: null, error: null } : { data: khuc ? dl.slice(...khuc) : dl, error: null, count: dl.length }).then(res, rej) },

  // Mọi lệnh gọi hàm database / kho ảnh cũng giả nốt — không bao giờ tới Supabase thật

  w.applyTab(tab)
  if (P.get('thang')) setTimeout(() => w.orderQuickMonth(), 300)
  setTimeout(() => {
    if (V === 'don') w.openNewOrderModal()

      d.querySelector('[data-seg="noTt"] [data-v="Đã cọc"]').click(); w.eval("moneySet('noCoc', 200000)"); w.ttForm('no')
      d.getElementById('noTtThan').closest('.fx-grp').scrollIntoView({ block: 'start' }) }, 300) }

    if (V === 'qr') { w.cacheOrders(don); w.viewOrderDetail(152); setTimeout(() => w.moQrCk(152), 200) }
