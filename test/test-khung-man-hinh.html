<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test khung màn hình admin (lỗi iPhone) — Ler &amp; Ther Blooming</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 24px; font: 14px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #FAF8F5; color: #2B2B2B; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #6B6B6B; margin: 0 0 20px; }
  .sub code { background: #EFEAE3; padding: 1px 5px; border-radius: 4px; }
  #tongket { padding: 12px 16px; border-radius: 10px; font-weight: 600; margin-bottom: 18px; }
  .ok-box   { background: #E8F5E9; color: #1B5E20; border: 1px solid #A5D6A7; }
  .fail-box { background: #FFEBEE; color: #B71C1C; border: 1px solid #EF9A9A; }
  h2 { font-size: 15px; margin: 22px 0 8px; padding-bottom: 6px; border-bottom: 1px solid #E5DFD7; }
  .ca { display: flex; gap: 8px; padding: 5px 0; align-items: baseline; }
  .dau { flex: 0 0 18px; font-weight: 700; }
  .ok .dau { color: #2E7D32; }
  .fail .dau { color: #C62828; }
  .fail { background: #FFF5F5; border-radius: 6px; padding-left: 6px; }
  .ten { flex: 1; }
  .chitiet { display: block; color: #C62828; font-family: ui-monospace, Consolas, monospace;
             font-size: 12.5px; white-space: pre-wrap; margin-top: 2px; }
  /* Khung giả lập điện thoại: rộng 390px để kích hoạt @media (max-width: 820px) */
  #dt { width: 390px; height: 700px; border: 1px solid #ddd; border-radius: 8px;
        position: absolute; left: -9999px; top: 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📱 Test khung màn hình admin</h1>
  <p class="sub">Canh lại lỗi iPhone: <b>thẻ đơn trắng thông tin</b> và <b>thanh trên che khuất, bấm không
     trúng</b>. Nạp <code>/admin/</code> vào khung 390px rồi kiểm cấu trúc — <b>không đăng nhập</b>, không
     đọc/ghi dữ liệu đơn hàng.</p>
  <div id="tongket">Đang chạy…</div>
  <div id="kq"></div>
</div>
<iframe id="dt" src="../admin/index.html"></iframe>

<script>
let soOk = 0, soFail = 0
const boxKq = document.getElementById('kq')

function nhom(ten) {
  const h = document.createElement('h2')
  h.textContent = ten
  boxKq.appendChild(h)
}

function test(ten, fn) {
  const row = document.createElement('div')
  row.className = 'ca'
  row.innerHTML = '<span class="dau"></span><span class="ten"></span>'
  const dau = row.querySelector('.dau'), t = row.querySelector('.ten')
  t.textContent = ten
  try {
    fn()
    soOk++; row.classList.add('ok'); dau.textContent = '✓'
  } catch (e) {
    soFail++; row.classList.add('fail'); dau.textContent = '✕'
    const ct = document.createElement('span')
    ct.className = 'chitiet'
    ct.textContent = e.message
    t.appendChild(ct)
  }
  boxKq.appendChild(row)
}

function bang(thuc, mong, ghiChu = '') {
  const a = JSON.stringify(thuc), b = JSON.stringify(mong)
  if (a !== b) throw new Error((ghiChu ? ghiChu + '\n' : '') + 'mong đợi: ' + b + '\nnhận được: ' + a)
}
function gan(thuc, mong, saiSo, ghiChu = '') {
  if (Math.abs(thuc - mong) > saiSo)
    throw new Error((ghiChu ? ghiChu + '\n' : '') +
      'mong đợi ≈ ' + mong + ' (±' + saiSo + ')\nnhận được: ' + thuc)
}

const dt = document.getElementById('dt')

;(async function main() {
  // iframe có thể đã tải xong TRƯỚC khi dòng này chạy (server local nhanh) → khi đó
  // sự kiện load không bao giờ bắn nữa, chờ mãi. Kiểm readyState trước đã.
  await new Promise(res => {
    const xong = () => { try { return dt.contentDocument.readyState === 'complete' && dt.contentWindow.location.href !== 'about:blank' } catch { return false } }
    if (xong()) return res()
    dt.addEventListener('load', res, { once: true })
  })
  // Chờ init() của admin chạy xong (nó có gọi Supabase để kiểm phiên đăng nhập)
  await new Promise(res => setTimeout(res, 1200))

  const w = dt.contentWindow, d = dt.contentDocument
  const css = el => w.getComputedStyle(el)
  const appWrap = d.getElementById('appWrap')
  const content = d.querySelector('.content')
  const topbar  = d.querySelector('.admin-topbar')

  if (!appWrap || !content || !topbar) {
    const tk = document.getElementById('tongket')
    tk.className = 'fail-box'
    tk.textContent = '✕ Không tìm thấy #appWrap / .content / .admin-topbar trong admin'
    return
  }

  // Chưa đăng nhập nên khung app đang display:none — bật lên để đo layout.
  // Chỉ bật khung, KHÔNG gọi hàm tải dữ liệu nào.
  appWrap.style.display = 'flex'
  await new Promise(res => setTimeout(res, 60))

  // ── 1. Thanh trên phải NGOÀI khung cuộn ─────────────────────────
  nhom('1. Thanh trên nằm ngoài khung cuộn (lỗi "che khuất, bấm không trúng")')
  test('.admin-topbar KHÔNG nằm trong .content', () =>
    bang(content.contains(topbar), false,
      'Nằm trong khung cuộn thì phải dùng position:sticky, mà sticky trong khung cuộn\n' +
      'là chỗ iOS vẽ sai toạ độ → thấy thanh nhưng chạm không trúng'))
  test('.admin-topbar là con trực tiếp của #appWrap', () =>
    bang(topbar.parentElement === appWrap, true))
  test('Ở khổ điện thoại, thanh trên KHÔNG dùng position:sticky', () =>
    bang(css(topbar).position, 'static',
      'Đã ra ngoài khung cuộn thì không cần sticky nữa — còn sticky là còn lỗi iOS'))
  test('Thanh trên vẫn hiện trên điện thoại', () =>
    bang(css(topbar).display, 'flex'))
  test('Thanh trên không bị co (flex-shrink: 0)', () =>
    bang(css(topbar).flexShrink, '0'))

  // ── 2. Khung app xếp dọc, .content là khung cuộn ─────────────────
  nhom('2. Khung app xếp dọc')
  test('#appWrap xếp theo chiều dọc', () =>
    bang(css(appWrap).flexDirection, 'column'))
  test('.content là khung cuộn (overflow-y: auto)', () =>
    bang(css(content).overflowY, 'auto'))
  test('.content có min-height: 0 để co được, không tràn ra ngoài', () =>
    bang(css(content).minHeight, '0px',
      'Thiếu min-height:0 thì nội dung dài tràn khỏi khung thay vì cuộn bên trong'))
  const tabs = d.querySelector('.bottom-tabs')
  test('Thanh trên + khung cuộn + thanh tab dưới vừa đúng chiều cao khung app', () =>
    gan(topbar.offsetHeight + content.offsetHeight + (tabs ? tabs.offsetHeight : 0), appWrap.offsetHeight, 1))

  // ── 2b. Thanh tab dưới đáy (23/09/2026) — cùng luật với thanh trên ──
  nhom('2b. Thanh tab dưới đáy nằm ngoài khung cuộn')
  test('Có thanh tab dưới đáy', () => { if (!tabs) throw new Error('không thấy .bottom-tabs') })
  if (tabs) {
    test('.bottom-tabs KHÔNG nằm trong .content (iOS vẽ sai phần tử dính trong khung cuộn)', () =>
      bang(content.contains(tabs), false))
    test('.bottom-tabs là con trực tiếp của #appWrap, đứng SAU .content', () => {
      bang(tabs.parentElement === appWrap, true)
      bang(!!(content.compareDocumentPosition(tabs) & w.Node.DOCUMENT_POSITION_FOLLOWING), true)
    })
    test('Thanh tab KHÔNG dùng position fixed/sticky (xếp trong khung dọc là đủ)', () =>
      bang(css(tabs).position, 'static'))
    test('Thanh tab hiện trên điện thoại và không bị co', () => {
      bang(css(tabs).display, 'flex')
      bang(css(tabs).flexShrink, '0')
    })
    test('Đáy thanh tab chạm đúng đáy khung app (không hở, không tràn)', () =>
      gan(tabs.getBoundingClientRect().bottom, appWrap.getBoundingClientRect().bottom, 1))
    test('Có đủ 5 nút: Tổng quan, Đơn hàng, Lịch giao, Chi phí, Menu', () =>
      bang([...tabs.querySelectorAll('.bt-item span')].map(s => s.textContent),
        ['Tổng quan', 'Đơn hàng', 'Lịch giao', 'Chi phí', 'Menu']))
    test('Nút cao ≥ 44px — đủ lớn cho ngón cái', () => {
      const h = tabs.querySelector('.bt-item').offsetHeight
      if (h < 44) throw new Error('nút tab chỉ cao ' + h + 'px')
    })

    // Lỗi thật khi làm (23/09): class đánh dấu lên <body> trùng tên class dùng để ẩn nút
    // → mở tab Đơn hàng trên điện thoại là CẢ TRANG trắng. Kiểm từng tab, bấm nút thật.
    const fab = d.getElementById('fabAdd')
    for (const [tab, coFab] of [['Orders', true], ['Expenses', true], ['Products', true], ['Delivery', false], ['Dashboard', false]]) {
      w.syncBottomTabs(tab)
      test(`[${tab}] trang vẫn hiện (body không bị ẩn), khung app vẫn cao đủ`, () => {
        bang(css(d.body).display !== 'none', true, 'body bị display:none → màn hình trắng trơn')
        gan(appWrap.offsetHeight, w.innerHeight, 2)
      })
      test(`[${tab}] nút ＋ nổi ${coFab ? 'HIỆN' : 'ẩn'}`, () =>
        bang(css(fab).display !== 'none', coFab))
      test(`[${tab}] đúng 1 nút tab sáng`, () =>
        bang(tabs.querySelectorAll('.bt-item.active').length, 1))
    }
    w.syncBottomTabs('Products')
    test('Tab không có ở thanh dưới (Sản phẩm) → nút "Menu" sáng', () =>
      bang(tabs.querySelector('.bt-more').classList.contains('active'), true))
    test('Nút "Thêm đơn" ở đầu tab ẩn trên điện thoại (đã có nút ＋ nổi)', () =>
      bang(css(d.querySelector('#panelOrders .panel-topbar .btn-green')).display, 'none'))
    test('Nút "Thêm sản phẩm" ở đầu tab cũng ẩn trên điện thoại (dùng nút ＋ nổi)', () =>
      bang(css(d.querySelector('#panelProducts .panel-topbar .btn-green')).display, 'none'))
    w.syncBottomTabs('Dashboard')
  }

  // ── 3. Chiều cao khung app — LỖI GỐC ────────────────────────────
  nhom('3. Chiều cao khung app không chạy theo bàn phím (lỗi "trắng thông tin")')
  test('#appWrap cao đúng bằng vùng nhìn thấy của cửa sổ', () =>
    gan(appWrap.offsetHeight, w.innerHeight, 2))

  test('Đổi --vvh (giả lập MỞ bàn phím) KHÔNG làm khung app co lại', () => {
    const truoc = appWrap.offsetHeight
    d.documentElement.style.setProperty('--vvh', '320px')  // bàn phím chiếm ~nửa màn
    const sau = appWrap.offsetHeight
    d.documentElement.style.removeProperty('--vvh')
    bang(sau, truoc,
      'Khung app đang bám vào --vvh. Đây CHÍNH LÀ lỗi cũ: mở bàn phím là khung co,\n' +
      'iOS thường không bắn resize khi đóng bàn phím → khung kẹt bé, nửa dưới trắng trơn.\n' +
      'Khung app phải dùng --apph (window.innerHeight), không dùng --vvh.')
  })

  test('Biến --apph có được đặt', () => {
    const v = d.documentElement.style.getPropertyValue('--apph')
    if (!/^\d+px$/.test(v)) throw new Error('--apph = "' + v + '" (mong đợi dạng "NNNpx")')
  })

  test('--apph khớp window.innerHeight', () =>
    gan(parseFloat(d.documentElement.style.getPropertyValue('--apph')), w.innerHeight, 2))

  // ── 4. Không ghi lại biến CSS khi giá trị không đổi ─────────────
  nhom('4. Không ghi biến CSS mỗi frame cuộn (nguồn gây giật + vẽ thiếu)')
  test('Gọi lại resize không làm --apph đổi giá trị', () => {
    const truoc = d.documentElement.style.getPropertyValue('--apph')
    w.dispatchEvent(new w.Event('resize'))
    bang(d.documentElement.style.getPropertyValue('--apph'), truoc)
  })
  test('Chiều cao được làm tròn (không ra số thập phân dài)', () => {
    const v = d.documentElement.style.getPropertyValue('--apph')
    if (v.includes('.')) throw new Error('--apph = "' + v + '" — còn số thập phân')
  })

  // ── 5. --vvh vẫn phải che được bàn phím cho modal ───────────────
  nhom('5. Modal vẫn tránh bàn phím (tính năng cũ không được mất)')
  const ov = d.querySelector('.modal-overlay')
  if (!ov) {
    test('Tìm thấy .modal-overlay để kiểm', () => { throw new Error('không có .modal-overlay nào') })
  } else {
    test('.modal-overlay vẫn co theo --vvh', () => {
      const dpOld = ov.style.display
      ov.style.display = 'flex'
      d.documentElement.style.setProperty('--vvh', '300px')
      const h = ov.offsetHeight
      d.documentElement.style.removeProperty('--vvh')
      ov.style.display = dpOld
      bang(h, 300,
        'Modal phải bám --vvh, nếu không bàn phím iOS lại che nút Lưu/Hủy')
    })
  }

  // ── 6. Trang không được có chỗ để cuộn (ảnh 1: cả trang kẹt lệch lên) ──
  nhom('6. Trang không có chỗ để iOS đẩy lệch (lỗi "mất thanh Admin, đáy trống")')
  const root = d.documentElement
  const se = d.scrollingElement || root
  const apphCu = root.style.getPropertyValue('--apph')

  test('body cao theo --apph, KHÔNG theo 100vh', () => {
    root.style.setProperty('--apph', '500px')      // giả lập vùng nhìn thấy thấp hơn 100vh
    const h = d.body.offsetHeight
    root.style.setProperty('--apph', apphCu)
    bang(h, 500,
      'body đang bám 100vh. Trên iPhone 100vh cao hơn vùng nhìn thấy → trang có chỗ cuộn,\n' +
      'bàn phím hiện là iOS đẩy trang lên, đóng bàn phím không trả lại → mất thanh Admin, đáy trống')
  })
  test('Màn đăng nhập cũng không dùng 100vh', () => {
    const lw = d.getElementById('loginWrap')
    const dpCu = lw.style.display
    lw.style.display = 'flex'
    root.style.setProperty('--apph', '500px')
    const h = lw.offsetHeight
    root.style.setProperty('--apph', apphCu)
    lw.style.display = dpCu
    if (h > 500) throw new Error('#loginWrap cao ' + h + 'px, vượt vùng nhìn thấy 500px → còn dùng 100vh')
  })
  test('html và body đều khoá cuộn', () => {
    bang(css(root).overflowY, 'hidden')
    bang(css(d.body).overflowY, 'hidden')
  })
  test('Trang không còn phần thừa để cuộn', () => {
    if (se.scrollHeight > se.clientHeight + 1)
      throw new Error('trang cao ' + se.scrollHeight + 'px trong khung ' + se.clientHeight + 'px → còn chỗ cuộn')
  })

  // ── 7. Đo lại vùng nhìn thấy sau khi focus đổi (ảnh 2: form cách bàn phím một khúc) ──
  nhom('7. Đo lại vùng nhìn thấy mỗi lần bàn phím mở/đóng (lỗi "form lơ lửng giữa màn")')
  const vv = w.visualViewport
  const search = d.getElementById('orderSearch')
  const doiMs = ms => new Promise(res => setTimeout(res, ms))
  if (!vv || !search) {
    test('Có visualViewport và ô Tìm mã đơn để kiểm', () => { throw new Error('thiếu visualViewport hoặc #orderSearch') })
  } else {
    const dung = Math.round(vv.height) + 'px'

    // iOS đổi chiều cao bàn phím mà không bắn resize → --vvh kẹt số cũ
    root.style.setProperty('--vvh', '123px')
    search.dispatchEvent(new w.FocusEvent('focusout', { bubbles: true }))
    await doiMs(750)
    test('Đóng bàn phím ở ô NGOÀI modal ("Tìm mã đơn") → --vvh được đo lại', () =>
      bang(root.style.getPropertyValue('--vvh'), dung,
        '--vvh vẫn kẹt số cũ khi iOS không báo sự kiện → form dừng cách bàn phím một khúc'))

    root.style.setProperty('--vvh', '123px')
    search.dispatchEvent(new w.FocusEvent('focusin', { bubbles: true }))
    await doiMs(750)
    test('Mở bàn phím ở ô ngoài modal → --vvh cũng được đo lại', () =>
      bang(root.style.getPropertyValue('--vvh'), dung))
  }

  tongKet()
})().catch(e => {
  // Lỗi ném RA NGOÀI test() (ví dụ hàm chưa tồn tại) thì phải báo đỏ rõ ràng,
  // đừng để ô tổng kết đứng nguyên chữ "Đang chạy…" trông như bị treo
  soFail++
  const row = document.createElement('div')
  row.className = 'ca fail'
  row.innerHTML = '<span class="dau">✕</span><span class="ten"></span>'
  const t = row.querySelector('.ten')
  t.textContent = 'Bộ test dừng giữa đường'
  const ct = document.createElement('span')
  ct.className = 'chitiet'
  ct.textContent = (e && e.message) || String(e)
  t.appendChild(ct)
  boxKq.appendChild(row)
  tongKet()
})

function tongKet() {
  const tk = document.getElementById('tongket')
  tk.className = soFail ? 'fail-box' : 'ok-box'
  tk.textContent = soFail
    ? '✕ ' + soFail + ' ca FAIL / ' + (soOk + soFail) + ' ca'
    : '✓ Tất cả ' + soOk + ' ca đều PASS'
}
</script>
</body>
</html>
