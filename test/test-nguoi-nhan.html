<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test người nhận + giờ giao — Ler &amp; Ther Blooming</title>
<style>
  body { margin: 0; padding: 24px; font: 14px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; background: #FAF8F5; color: #2B2B2B; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #6B6B6B; margin: 0 0 20px; }
  #tongket { padding: 12px 16px; border-radius: 10px; font-weight: 600; margin-bottom: 18px; }
  .ok-box { background: #E8F5E9; color: #1B5E20; border: 1px solid #A5D6A7; }
  .fail-box { background: #FFEBEE; color: #B71C1C; border: 1px solid #EF9A9A; }
  h2 { font-size: 15px; margin: 22px 0 8px; padding-bottom: 6px; border-bottom: 1px solid #E5DFD7; }
  .ca { display: flex; gap: 8px; padding: 5px 0; align-items: baseline; }
  .dau { flex: 0 0 18px; font-weight: 700; }
  .ok .dau { color: #2E7D32; } .fail .dau { color: #C62828; }
  .fail { background: #FFF5F5; border-radius: 6px; padding-left: 6px; }
  .ten { flex: 1; }
  .chitiet { display: block; color: #C62828; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; white-space: pre-wrap; margin-top: 2px; }
  iframe { width: 390px; height: 760px; border: 0; position: absolute; left: -9999px; top: 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Test "người nhận + giờ giao"</h1>
  <p class="sub">Web khách GHÉP người nhận + giờ vào ghi chú đơn, admin TÁCH ra. Kiểm cả 2 phía bằng cách bấm nút thật.
     Gửi đơn dùng <b>database giả</b> (thay <code>sb.rpc</code>) — không tạo đơn thật.</p>
  <div id="tongket">Đang chạy…</div>
  <div id="kq"></div>
</div>
<iframe id="web" src="../san-pham"></iframe>
<iframe id="adm" src="../admin/index.html"></iframe>
<script src="../js/dungchung.js"></script>
<script>
let soOk = 0, soFail = 0
const boxKq = document.getElementById('kq')
function nhom(t) { const h = document.createElement('h2'); h.textContent = t; boxKq.appendChild(h) }
function test(ten, fn) {
  const row = document.createElement('div'); row.className = 'ca'
  row.innerHTML = '<span class="dau"></span><span class="ten"></span>'
  const dau = row.querySelector('.dau'), t = row.querySelector('.ten'); t.textContent = ten
  try { fn(); soOk++; row.classList.add('ok'); dau.textContent = '✓' }
  catch (e) { soFail++; row.classList.add('fail'); dau.textContent = '✕'
    const c = document.createElement('span'); c.className = 'chitiet'; c.textContent = e.message; t.appendChild(c) }
  boxKq.appendChild(row)
}
function bang(thuc, mong, ghi = '') {
  const a = JSON.stringify(thuc), b = JSON.stringify(mong)
  if (a !== b) throw new Error((ghi ? ghi + '\n' : '') + 'mong đợi: ' + b + '\nnhận được: ' + a)
}
const cho = ms => new Promise(r => setTimeout(r, ms))
function doiKhung(f) {
  return new Promise(res => {
    const xong = () => { try { return f.contentDocument.readyState === 'complete' && f.contentWindow.location.href !== 'about:blank' } catch { return false } }
    if (xong()) return res()
    f.addEventListener('load', res, { once: true })
  })
}

;(async function main() {
  // ── 1. Hàm dùng chung ──
  nhom('1. Ghép / tách ghi chú (js/dungchung.js)')
  test('Đủ cả 3 thứ → đúng mẫu, mỗi thứ 1 dòng', () =>
    bang(ghepGhiChuDon({ nguoiNhan: 'Lan', sdtNhan: '0912345678', gio: '15h', ghiChu: 'Kèm thiệp' }),
      'Người nhận: Lan · 0912345678\nGiờ giao: 15h\nKèm thiệp'))
  test('Không có gì → chuỗi rỗng (không ghi "Người nhận:" trống)', () => bang(ghepGhiChuDon({}), ''))
  test('Chỉ có ghi chú → giữ nguyên ghi chú, không thêm dòng lạ', () => bang(ghepGhiChuDon({ ghiChu: '  giao trước 10h ' }), 'giao trước 10h'))
  test('Chỉ tên người nhận, không SĐT', () => bang(ghepGhiChuDon({ nguoiNhan: 'Bà nội' }), 'Người nhận: Bà nội'))
  const mau = [
    { nguoiNhan: 'Lan', sdtNhan: '0912345678', gio: '15h', ghiChu: 'Kèm thiệp\nnơ đỏ' },
    { nguoiNhan: '', sdtNhan: '', gio: '9h', ghiChu: '' },
    { nguoiNhan: 'Chị Hà', sdtNhan: '', gio: '', ghiChu: 'Gọi trước khi tới' },
    { nguoiNhan: '', sdtNhan: '', gio: '', ghiChu: 'Ghi chú thường của đơn cũ' },
  ]
  mau.forEach((m, i) => test(`Ghép rồi tách lại ra đúng như cũ (mẫu ${i + 1})`, () => bang(tachGhiChuDon(ghepGhiChuDon(m)), m)))
  test('Đơn cũ (ghi chú tự do) → cả chuỗi là ghi chú, không bị nuốt mất', () =>
    bang(tachGhiChuDon('Người nhận thích màu hồng'), { nguoiNhan: '', sdtNhan: '', gio: '', ghiChu: 'Người nhận thích màu hồng' }))
  test('Ghi chú rỗng / null không lỗi', () => bang(tachGhiChuDon(null), { nguoiNhan: '', sdtNhan: '', gio: '', ghiChu: '' }))
  test('Chip giờ giao: 8h → 21h, mỗi giờ 1 chip', () => bang(GIO_GIAO.length, 14))
  test('Mã đơn giống admin: #LT-0153', () => bang(maDon(153), '#LT-0153'))
  // Giờ + phút (26/09): phút 00 ghi gọn "15h" — y như đơn cũ, và SQL 25 (gio_giao_cua) đọc cùng mẫu
  test('Phút: bước 5 phút, 00 → 55 (12 số)', () => bang(PHUT_GIAO, ['00', '05', '10', '15', '20', '25', '30', '35', '40', '45', '50', '55']))
  test('ghepGio: 15h + 30 → "15h30", 15h + 00 → "15h", không giờ → ""', () =>
    bang([ghepGio('15h', '30'), ghepGio('15h', '00'), ghepGio('9h', ''), ghepGio('', '30')], ['15h30', '15h', '9h', '']))
  test('tachGio: "15h30" / "15h" (đơn cũ) / chữ lạ', () =>
    bang([tachGio('15h30'), tachGio('15h'), tachGio('chiều')], [{ gio: '15h', phut: '30' }, { gio: '15h', phut: '00' }, { gio: '', phut: '' }]))
  test('soPhutGio + gioTuSoPhut: xếp giờ + tính giờ nhắc trước 2 tiếng', () =>
    bang([soPhutGio('15h30'), soPhutGio('9h'), soPhutGio(''), gioTuSoPhut(930 - 120), gioTuSoPhut(600)], [930, 540, null, '13h30', '10h']))
  test('Ghép rồi tách lại giờ có phút', () => bang(tachGhiChuDon(ghepGhiChuDon({ gio: '8h45', ghiChu: 'x' })).gio, '8h45'))

  // ── 2. Web khách: form đặt hoa — bấm thật ──
  const web = document.getElementById('web')
  await doiKhung(web); await cho(1500)
  const w = web.contentWindow, d = web.contentDocument, id = x => d.getElementById(x)
  nhom('2. Web khách — form đặt hoa (bấm nút thật)')
  if (typeof w.openOrderModal !== 'function') { test('Trang sản phẩm nạp được JS', () => { throw new Error('không có openOrderModal') }) }
  else {
    w.openOrderModal(1, 'Tulip thử')
    await cho(50)
    const mai = new Date(Date.now() + 864e5).toLocaleDateString('sv-SE')
    const kia = new Date(Date.now() + 2 * 864e5).toLocaleDateString('sv-SE')
    test('KHÔNG còn ô lịch iPhone (input type=date) trong form', () => bang(d.querySelectorAll('#orderForm input[type="date"]').length, 0))
    test('Mặc định giao NGÀY MAI, chip "Ngày mai" sáng', () => {
      bang(id('orderDate').value, mai)
      bang(d.querySelector('#omNgay .om-chip2.on')?.textContent.trim(), 'Ngày mai')
    })
    d.querySelector('#omNgay [data-d="2"]').click()
    test('Bấm "Ngày kia" → ngày giao = ngày kia', () => bang(id('orderDate').value, kia))
    id('omNgayKhac').click(); await cho(20)
    test('Bấm "Chọn ngày" → lịch mở', () => bang(id('omLich').style.display, 'block'))
    const nutSau = d.querySelectorAll('#omLich .ol-h button')[1]
    nutSau.click(); await cho(20)
    test('Bấm › trên lịch → lịch VẪN MỞ (bẫy popover tự đóng)', () => bang(id('omLich').style.display, 'block'))
    test('Ngày đã qua không bấm được', () => {
      w.doiThangLich(-1)
      const hn = new Date().getDate()
      if (hn > 1) {
        const hqua = [...d.querySelectorAll('#omLich .ol-d')].find(b => b.textContent === String(hn - 1))
        bang(hqua.disabled, true)
      }
    })
    const ngay20 = [...d.querySelectorAll('#omLich .ol-d:not([disabled])')].pop()
    ngay20.click()
    test('Chọn 1 ngày trên lịch → lịch đóng, chip lịch hiện dd/mm', () => {
      bang(id('omLich').style.display, 'none')
      const v = id('orderDate').value
      bang(id('omNgayKhac').textContent.trim(), v.slice(8, 10) + '/' + v.slice(5, 7))
    })
    // Bánh xe giờ | phút (banhXeGio): số thứ tự giờ 8h=0 … 21h=13, phút 00=0 15=1 30=2 45=3
    const bam = (goc, k, i) => goc.querySelector(`.bxg-cot[data-k="${k}"] [data-i="${i}"]`).click()
    const omG = id('omGio')
    test('Mở form: chưa hẹn giờ, bánh xe mờ, không có nút "Bỏ giờ"', () => {
      bang([id('orderTime').value, omG.querySelector('.bxg-banh').classList.contains('trong'), omG.querySelector('.bxg-so').textContent], ['', true, 'Chưa hẹn giờ'])
      bang(omG.querySelector('.bxg-bo').style.display, 'none')
    })
    test('Web khách: bánh xe không viền, không hiện giờ + "Bỏ giờ" bên cạnh (góp ý 26/09)', () =>
      bang([w.getComputedStyle(omG.querySelector('.bxg-banh')).borderTopWidth, w.getComputedStyle(omG.querySelector('.bxg-ben')).display], ['0px', 'none']))
    test('Khung bánh xe gọn: cao ≤ 110px, rộng ≤ 160px (góp ý "khung hơi to")', () => {
      const r = omG.querySelector('.bxg-banh').getBoundingClientRect()
      if (r.height > 110 || r.width > 160) throw new Error(Math.round(r.width) + '×' + Math.round(r.height))
    })
    bam(omG, 'h', 7)
    test('Bấm số 15 → 15h (phút mặc định 00), hiện "15h00"', () =>
      bang([id('orderTime').value, omG.querySelector('.bxg-so').textContent, omG.querySelector('.bxg-banh').classList.contains('trong')], ['15h', '15h00', false]))
    omG.querySelector('.bxg-bo').click()
    test('Bấm "Bỏ giờ" → không hẹn giờ', () => bang(id('orderTime').value, ''))
    bam(omG, 'h', 6); bam(omG, 'p', 6)
    test('Bấm 14 rồi 30 → 14h30', () => bang(id('orderTime').value, '14h30'))
    bam(omG, 'h', 8)
    test('Đổi giờ sang 16 → GIỮ phút 30 → 16h30', () => bang(id('orderTime').value, '16h30'))
    const cotH = omG.querySelector('.bxg-cot[data-k="h"]')
    cotH.dispatchEvent(new w.WheelEvent('wheel', { deltaY: 100, bubbles: true, cancelable: true }))
    test('Lăn chuột xuống 1 nấc ở cột giờ → +1 giờ (17h30), không nhảy 2–3 số', () => bang(id('orderTime').value, '17h30'))
    cotH.dispatchEvent(new w.WheelEvent('wheel', { deltaY: -100, bubbles: true, cancelable: true }))
    test('Lăn chuột lên 1 nấc → về 16h30', () => bang(id('orderTime').value, '16h30'))
    cotH.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'ArrowUp', bubbles: true }))
    test('Phím ▲ ở cột giờ → 15h30', () => bang(id('orderTime').value, '15h30'))
    cotH.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true }))
    test('Số đang chọn được tô (giờ 16, phút 30)', () =>
      bang([...omG.querySelectorAll('.bxg-cot .on')].map(x => x.textContent), ['16', '30']))
    omG.querySelector('.bxg-cot[data-k="p"]').dispatchEvent(new w.WheelEvent('wheel', { deltaY: 100, bubbles: true, cancelable: true }))
    test('Lăn chuột 1 nấc ở cột phút → +5 phút (16h35)', () => bang(id('orderTime').value, '16h35'))
    test('Mặc định "Tôi nhận" → ô người nhận ẩn', () => bang(id('omNhanKhac').style.display, 'none'))
    d.querySelector('#omNhan [data-v="1"]').click()
    test('Bấm "Tặng người khác" → hiện ô tên + SĐT người nhận', () => bang(id('omNhanKhac').style.display, ''))

    // Điền + gửi với database GIẢ
    let goi = null
    w.eval('sb').rpc = (ten, thamSo) => { goi = { ten, thamSo }; return Promise.resolve({ data: 153, error: null }) }
    id('orderName').value = 'Minh Anh'; id('orderPhone').value = '0912 345 678'
    id('orderAddress').value = '12 Lê Lợi'; id('orderRecvName').value = 'Lan'; id('orderRecvPhone').value = '0987654321'
    id('orderNote').value = 'Kèm thiệp'
    const hanGui = id('orderDate').value
    id('orderSubmitBtn').click(); await cho(80)
    test('Gọi place_order (database giả)', () => bang(goi && goi.ten, 'place_order'))
    test('Ghi chú đơn = người nhận + giờ + ghi chú, đúng mẫu', () =>
      bang(goi.thamSo.p_note, 'Người nhận: Lan · 0987654321\nGiờ giao: 16h35\nKèm thiệp'))
    test('Ngày giao gửi đi đúng ngày đã chọn', () => bang(goi.thamSo.p_delivery_date, hanGui))
    test('SĐT người đặt được chuẩn hoá', () => bang(goi.thamSo.p_phone, '0912345678'))
    test('Màn cảm ơn hiện mã đơn #LT-0153', () => {
      if (!/#LT-0153/.test(id('orderModalBody').textContent)) throw new Error(id('orderModalBody').textContent.slice(0, 200))
    })

    w.closeOrderModal(); w.openOrderModal(1, 'Tulip thử'); await cho(30)
    goi = null
    id('orderName').value = 'Khách B'; id('orderPhone').value = '0912345678'; id('orderAddress').value = 'Q.3'
    id('orderSubmitBtn').click(); await cho(80)
    test('Không tặng, không giờ, không ghi chú → ghi chú rỗng (null)', () => bang(goi.thamSo.p_note, null))
  }

  // ── 3. Admin: tách ra khi sửa, ghép lại khi lưu ──
  const adm = document.getElementById('adm')
  await doiKhung(adm); await cho(1500)
  const a = adm.contentWindow, ad = adm.contentDocument, aid = x => ad.getElementById(x)
  nhom('3. Admin — chi tiết đơn + form sửa đơn')
  if (typeof a.openOrderEditModal !== 'function') { test('Admin nạp được JS', () => { throw new Error('không có openOrderEditModal') }) }
  else {
    aid('appWrap').style.display = 'flex'
    const don = { id: 777, customer_name: 'Minh Anh', customers: { name: 'Minh Anh', phone: '0912345678' }, product_name: 'Tulip', quantity: 1,
      unit_price: 600000, shipping_fee: 0, total: 600000, status: 'Mới', delivery_date: new Date().toLocaleDateString('sv-SE'),
      delivery_address: '12 Lê Lợi', note: 'Người nhận: Lan · 0987654321\nGiờ giao: 16h\nKèm thiệp', created_at: new Date().toISOString() }
    a.cacheOrders([don])
    a.viewOrderDetail(777)
    const txt = aid('customerOrdersBody').textContent
    test('Chi tiết đơn hiện "Người nhận: Lan · 0987654321"', () => { if (!/Người nhận\s*Lan · 0987654321/.test(txt)) throw new Error(txt.slice(0, 300)) })
    test('Chi tiết đơn hiện giờ giao 16h cạnh ngày', () => { if (!/16h/.test(txt)) throw new Error('không thấy 16h') })
    test('Khung "Ghi chú" chỉ còn phần ghi chú thật', () => {
      const g = ad.querySelector('#customerOrdersBody .od-ghichu')
      bang(g && g.textContent.replace('Ghi chú', '').trim(), 'Kèm thiệp')
    })
    a.openOrderEditModal(777); await cho(30)
    test('Sửa đơn: ô người nhận / SĐT / giờ / ghi chú tự điền đúng', () => {
      bang([aid('oeRecvName').value, aid('oeRecvPhone').value, aid('oeGio').value, aid('oeNote').value], ['Lan', '0987654321', '16h', 'Kèm thiệp'])
    })
    const oeG = ad.querySelector('[data-gio-for="oeGio"]')
    const bamA = (goc, k, i) => goc.querySelector(`.bxg-cot[data-k="${k}"] [data-i="${i}"]`).click()
    test('Admin: bánh xe không viền, vẫn hiện giờ + "Bỏ giờ" bên cạnh', () =>
      bang([a.getComputedStyle(oeG.querySelector('.bxg-banh')).borderTopWidth, a.getComputedStyle(oeG.querySelector('.bxg-ben')).display], ['0px', 'flex']))
    test('Sửa đơn: bánh xe tô đúng 16 · 00', () => bang([...oeG.querySelectorAll('.bxg-cot .on')].map(x => x.textContent), ['16', '00']))
    // khung test nằm ngoài màn hình → trình duyệt vẽ chậm, ResizeObserver tới trễ: chờ tối đa 1 giây
    for (let i = 0; i < 20 && oeG.querySelector('.bxg-cot[data-k="h"]').scrollTop !== 8 * 36; i++) await cho(50)
    test('Sửa đơn: bánh xe QUAY tới đúng 16h (không đứng ở 8h)', () => bang(oeG.querySelector('.bxg-cot[data-k="h"]').scrollTop, 8 * 36))
    test('Sửa đơn: mục "Người nhận" có dữ liệu nên tự mở', () => {
      const nut = [...ad.querySelectorAll('#orderEditModal .fx-more')].find(b => b.textContent.includes('Người nhận'))
      bang(nut.classList.contains('open'), true)
    })
    test('Lưu lại không đổi gì → ghi chú y hệt ban đầu', () => bang(a.ghiChuTuForm('oe'), don.note))
    // Lỗi thật 26/09: trình duyệt tự "hít" cột về số đầu ngay sau khi form hiện → từng đổi ngầm giờ đơn thành 8h
    const cotOe = oeG.querySelector('.bxg-cot[data-k="h"]')
    cotOe.scrollTop = 0                      // cuộn KHÔNG do tay người
    cotOe.dispatchEvent(new a.Event('scroll'))   // khung test ẩn: trình duyệt có lúc không tự bắn sự kiện cuộn
    for (let i = 0; i < 20 && cotOe.scrollTop !== 8 * 36; i++) await cho(50)
    test('Cột tự cuộn về 8h mà không ai chạm → giờ đơn GIỮ 16h, bánh xe tự quay lại', () =>
      bang([aid('oeGio').value, cotOe.scrollTop, !!aid('orderEditModal').dataset.dirty], ['16h', 8 * 36, false]))
    test('Sửa đơn cũ "16h": hiện 16h00 + giờ nhắc 14h', () =>
      bang([oeG.querySelector('.bxg-so').textContent, oeG.querySelector('.bxg-phu').textContent.trim()], ['16h00', 'Mail nhắc lúc 14h']))
    bamA(oeG, 'h', 10)
    test('Đổi sang 18 → ghi chú đổi đúng dòng giờ', () =>
      bang(a.ghiChuTuForm('oe'), 'Người nhận: Lan · 0987654321\nGiờ giao: 18h\nKèm thiệp'))
    aid('orderEditModal').dataset.dirty = ''
    bamA(oeG, 'p', 9)
    test('Bấm phút 45 → 18h45, nhắc lúc 16h45, tính là "đang nhập dở"', () => {
      bang([aid('oeGio').value, oeG.querySelector('.bxg-so').textContent, oeG.querySelector('.bxg-phu').textContent.trim()], ['18h45', '18h45', 'Mail nhắc lúc 16h45'])
      bang(aid('orderEditModal').dataset.dirty, '1')
    })
    oeG.querySelector('.bxg-bo').click()
    test('Bấm "Bỏ giờ" → bỏ hẳn giờ, hết dòng nhắc', () =>
      bang([aid('oeGio').value, oeG.querySelector('.bxg-so').textContent, oeG.querySelector('.bxg-phu').textContent], ['', 'Chưa hẹn giờ', 'Cuộn hoặc bấm số để chọn']))
    aid('orderEditModal').dataset.dirty = ''; a.closeOrderEditModal()

    // Nhãn giờ trên thẻ đơn hôm nay (Tổng quan / Lịch giao): còn ≤ 2 tiếng → cam, tới giờ → đỏ
    const bayGio = new Date().getHours() * 60 + new Date().getMinutes()
    const nhan = (phut, status = 'Mới') => { const x = ad.createElement('div'); x.innerHTML = a.gioBadge({ note: 'Giờ giao: ' + a.gioTuSoPhut(phut), status }, true); return x.firstElementChild }
    if (bayGio + 90 < 24 * 60) test('Đơn hôm nay còn 1g30 → nhãn cam "còn 1g30"', () => {
      const n = nhan(bayGio + 90); bang([n.classList.contains('sap'), / · còn 1g30$/.test(n.textContent)], [true, true])
    })
    if (bayGio >= 30) test('Đơn hôm nay đã qua giờ, chưa đi giao → nhãn đỏ "tới giờ"', () => {
      const n = nhan(bayGio - 30); bang([n.classList.contains('qua'), / · tới giờ$/.test(n.textContent)], [true, true])
    })
    if (bayGio >= 30) test('Đơn "Đang giao" → không báo tới giờ nữa', () => bang(nhan(bayGio - 30, 'Đang giao').className, 'dv-gio'))
    test('Đơn không ghi giờ → không có nhãn', () => bang(a.gioBadge({ note: 'Kèm thiệp', status: 'Mới' }, true), ''))

    a.openNewOrderModal(); await cho(30)
    test('Thêm đơn: giờ + người nhận trống khi mở form', () =>
      bang([aid('noGio').value, aid('noRecvName').value, aid('noRecvPhone').value], ['', '', '']))
    const noG = ad.querySelector('[data-gio-for="noGio"]')
    test('Thêm đơn: bánh xe về "Chưa hẹn giờ" (không giữ giờ của đơn vừa sửa)', () => bang(noG.querySelector('.bxg-so').textContent, 'Chưa hẹn giờ'))
    bamA(noG, 'h', 2); bamA(noG, 'p', 3)
    aid('noRecvName').value = 'Bà nội'
    test('Thêm đơn: ghép ghi chú giống hệt web khách', () => bang(a.ghiChuTuForm('no'), 'Người nhận: Bà nội\nGiờ giao: 10h15'))
    aid('orderNewModal').dataset.dirty = ''; a.closeNewOrderModal()
  }

  const tk = document.getElementById('tongket')
  tk.className = soFail ? 'fail-box' : 'ok-box'
  tk.textContent = soFail ? '✕ ' + soFail + ' ca FAIL / ' + (soOk + soFail) + ' ca' : '✓ Tất cả ' + soOk + ' ca đều PASS'
})().catch(e => {
  soFail++
  const tk = document.getElementById('tongket'); tk.className = 'fail-box'; tk.textContent = '✕ Lỗi khi chạy test: ' + e.message
})
</script>
